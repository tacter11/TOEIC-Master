
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans);}
#app{padding:clamp(.75rem,3vw,1.5rem);max-width:680px;margin:0 auto;width:100%;}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.screen{display:none;}.screen.active{display:block;}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:clamp(.75rem,2.5vw,1.25rem);}
.topbar-title{font-size:clamp(14px,3.5vw,17px);font-weight:500;flex:1;color:var(--color-text-primary);}
.back-btn{font-size:clamp(12px,2.5vw,13px);color:var(--color-text-secondary);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:var(--border-radius-md);}
.back-btn:hover{background:var(--color-background-secondary);}
button{cursor:pointer;font-family:var(--font-sans);font-size:clamp(13px,2.8vw,14px);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);padding:clamp(6px,1.5vw,8px) clamp(12px,3vw,16px);transition:background .15s;}
button:hover{background:var(--color-background-secondary);}
button:active{transform:scale(.98);}
button.primary{background:#378ADD;color:#fff;border-color:#378ADD;}
button.primary:hover{background:#185FA5;border-color:#185FA5;}
button.danger{color:var(--color-text-danger);border-color:var(--color-border-danger);}
button.success{color:var(--color-text-success);border-color:var(--color-border-success);}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.progress-bar{height:4px;background:var(--color-background-secondary);border-radius:2px;margin-bottom:.75rem;overflow:hidden;}
.progress-fill{height:100%;background:#378ADD;border-radius:2px;transition:width .3s;}

/* Home */
.home-header{text-align:center;padding:clamp(.75rem,3vw,1.5rem) 0 clamp(.75rem,2vw,1rem);}
.home-header .app-icon{font-size:clamp(28px,7vw,38px);margin-bottom:6px;}
.home-header h1{font-size:clamp(16px,4.5vw,22px);font-weight:500;margin-bottom:3px;}
.home-header p{font-size:clamp(11px,2.5vw,13px);color:var(--color-text-secondary);}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,2vw,12px);margin-bottom:clamp(8px,2vw,12px);}
.mode-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:clamp(.75rem,3vw,1.25rem) clamp(.5rem,2vw,1rem);text-align:center;cursor:pointer;background:var(--color-background-primary);transition:border-color .15s,background .15s;}
.mode-card:hover{border-color:var(--color-border-primary);background:var(--color-background-secondary);}
.mode-card.disabled{opacity:.4;pointer-events:none;}
.mode-card .ico{font-size:clamp(22px,5vw,30px);margin-bottom:clamp(4px,1vw,8px);}
.mode-card h3{font-size:clamp(13px,3vw,15px);font-weight:500;color:var(--color-text-primary);}

/* Group select */
.group-item{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:clamp(10px,2.5vw,14px) clamp(10px,3vw,14px);cursor:pointer;background:var(--color-background-primary);display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:background .15s;}
.group-item:hover{background:var(--color-background-secondary);}
.group-num{width:clamp(26px,6vw,32px);height:clamp(26px,6vw,32px);border-radius:50%;background:var(--color-background-info);color:var(--color-text-info);display:flex;align-items:center;justify-content:center;font-size:clamp(12px,2.5vw,14px);font-weight:500;flex-shrink:0;}
.group-info h4{font-size:clamp(13px,3vw,14px);font-weight:500;}
.group-info p{font-size:clamp(10px,2vw,12px);color:var(--color-text-secondary);margin-top:2px;}

/* Flash card */
.flash-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-primary);min-height:clamp(200px,45vw,300px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(1rem,4vw,1.75rem) clamp(.75rem,3vw,1.25rem);text-align:center;position:relative;overflow:hidden;margin-bottom:.75rem;}
.flash-overlay{position:absolute;inset:0;background:var(--color-background-secondary);opacity:0;pointer-events:none;transition:opacity .08s;}
.flash-overlay.on{opacity:1;}
.illus-wrap{width:clamp(70px,18vw,110px);height:clamp(56px,14vw,88px);margin-bottom:clamp(6px,1.5vw,12px);flex-shrink:0;}
.illus-wrap svg{width:100%;height:100%;}
.word-en{font-size:clamp(22px,6vw,34px);font-weight:500;letter-spacing:.5px;margin-bottom:6px;}
.word-ja{font-size:clamp(15px,4vw,21px);color:var(--color-text-secondary);}
.word-pos{font-size:clamp(10px,2vw,12px);color:var(--color-text-tertiary);margin-top:4px;}
.lap-badge{position:absolute;top:10px;right:10px;font-size:clamp(10px,2vw,12px);background:var(--color-background-info);color:var(--color-text-info);padding:3px 8px;border-radius:var(--border-radius-md);}
.counter{font-size:clamp(11px,2.5vw,13px);color:var(--color-text-secondary);text-align:center;margin-bottom:.75rem;}
.speed-row{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;}
.speed-row label{font-size:clamp(11px,2.5vw,13px);color:var(--color-text-secondary);white-space:nowrap;}
.speed-row input{flex:1;}
.speed-val{font-size:clamp(11px,2.5vw,12px);color:var(--color-text-secondary);min-width:52px;text-align:right;}
.laps-row{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;}
.laps-row label{font-size:clamp(11px,2.5vw,13px);color:var(--color-text-secondary);white-space:nowrap;}
.laps-row input{width:56px;padding:4px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);font-size:13px;text-align:center;}

/* Quiz */
.quiz-word{font-size:clamp(24px,7vw,36px);font-weight:500;text-align:center;padding:clamp(.75rem,2vw,1.25rem) 0 .25rem;letter-spacing:.5px;}
.quiz-pos{font-size:clamp(10px,2vw,12px);color:var(--color-text-tertiary);text-align:center;margin-bottom:clamp(.75rem,2vw,1rem);}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,10px);margin-bottom:.75rem;}
.choice-btn{padding:clamp(10px,2.5vw,14px) clamp(6px,1.5vw,10px);font-size:clamp(12px,2.8vw,14px);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;text-align:center;transition:background .15s;font-family:var(--font-sans);color:var(--color-text-primary);line-height:1.4;}
.choice-btn:hover:not(:disabled){background:var(--color-background-secondary);}
.choice-btn.correct{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success);}
.choice-btn.wrong{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger);}
.choice-btn:disabled{cursor:default;}
.quiz-feedback{text-align:center;font-size:clamp(12px,2.8vw,14px);font-weight:500;min-height:20px;margin-bottom:.75rem;}
.quiz-meta{display:flex;justify-content:space-between;font-size:clamp(10px,2vw,12px);color:var(--color-text-secondary);margin-bottom:.75rem;}

/* Result */
.result-wrap{text-align:center;padding:clamp(1rem,4vw,1.75rem) 0;}
.result-wrap .big{font-size:clamp(36px,9vw,52px);margin-bottom:10px;}
.result-wrap h3{font-size:clamp(16px,4vw,20px);font-weight:500;margin-bottom:4px;}
.result-wrap p{font-size:clamp(12px,2.8vw,14px);color:var(--color-text-secondary);margin-bottom:1.25rem;}
.result-score{font-size:clamp(30px,8vw,42px);font-weight:500;color:#378ADD;margin-bottom:2px;}
.result-sub{font-size:clamp(11px,2.5vw,13px);color:var(--color-text-secondary);margin-bottom:1.25rem;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.5vw,10px);margin-bottom:1rem;}
.stat-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:clamp(.5rem,2vw,.85rem);text-align:center;}
.stat-card .sv{font-size:clamp(18px,5vw,24px);font-weight:500;}
.stat-card .sl{font-size:clamp(10px,2vw,12px);color:var(--color-text-secondary);margin-top:2px;}

/* Wrong list */
.wrong-item{display:flex;align-items:center;gap:8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:clamp(8px,2vw,12px);margin-bottom:6px;background:var(--color-background-primary);}
.wrong-item .we{font-size:clamp(13px,3vw,15px);font-weight:500;}
.wrong-item .wj{font-size:clamp(11px,2.5vw,13px);color:var(--color-text-secondary);}
.wrong-item .wp{font-size:clamp(9px,2vw,11px);color:var(--color-text-tertiary);margin-top:2px;}
</style>

<div id="app">
<h2 class="sr-only">TOEIC頻出単語学習アプリ</h2>

<!-- Home -->
<div id="s-home" class="screen active">
  <div class="home-header">
    <div class="app-icon">📚</div>
    <h1>TOEIC単語マスター</h1>
    <p>頻出120語 · 4グループ</p>
  </div>
  <div class="mode-grid">
    <div class="mode-card" onclick="goGroupSelect('learn')">
      <div class="ico">⚡</div><h3>学習モード</h3>
    </div>
    <div class="mode-card" onclick="goGroupSelect('test')">
      <div class="ico">✏️</div><h3>テストモード</h3>
    </div>
    <div class="mode-card" id="review-card" onclick="startReview()">
      <div class="ico">🔁</div><h3>復習モード</h3>
    </div>
    <div class="mode-card" onclick="showWrongList()">
      <div class="ico">📋</div><h3>間違いリスト</h3>
    </div>
  </div>
  <div id="home-wrong-count" style="text-align:center;font-size:clamp(11px,2.5vw,12px);color:var(--color-text-secondary);"></div>
</div>

<!-- Group Select -->
<div id="s-group" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホーム</button>
    <div class="topbar-title" id="group-mode-title"></div>
  </div>
  <div id="group-list"></div>
</div>

<!-- Learn -->
<div id="s-learn" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="learnStop()"><i class="ti ti-arrow-left" aria-hidden="true"></i> 戻る</button>
    <div class="topbar-title" id="learn-title"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="learn-prog" style="width:0%"></div></div>
  <div class="flash-card">
    <div class="flash-overlay" id="flash-ov"></div>
    <span class="lap-badge" id="lap-badge"></span>
    <div class="illus-wrap" id="illus-wrap"></div>
    <div class="word-en" id="l-en">READY?</div>
    <div class="word-ja" id="l-ja">スタートを押して開始</div>
    <div class="word-pos" id="l-pos"></div>
  </div>
  <div class="counter" id="l-counter"></div>
  <div class="laps-row">
    <label><i class="ti ti-repeat" aria-hidden="true"></i> 周回数</label>
    <input type="number" id="lap-input" min="1" max="10" value="3">
    <span style="font-size:clamp(11px,2.5vw,13px);color:var(--color-text-secondary);">周</span>
  </div>
  <div class="speed-row">
    <label><i class="ti ti-clock" aria-hidden="true"></i> 速度</label>
    <input type="range" id="speed" min="1" max="5" value="3" step="1" oninput="onSpeed()">
    <span class="speed-val" id="speed-val">普通</span>
  </div>
  <div class="btn-row">
    <button class="primary" id="l-start" onclick="learnStart()">スタート</button>
    <button id="l-pause" onclick="learnPause()" style="display:none">一時停止</button>
    <button id="l-stop-btn" onclick="learnStop()" class="danger" style="display:none">終了</button>
  </div>
</div>

<!-- Learn Result -->
<div id="s-learn-result" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホーム</button>
    <div class="topbar-title">学習完了</div>
  </div>
  <div class="result-wrap">
    <div class="big">✅</div>
    <h3>学習完了！</h3>
    <p id="lr-msg"></p>
    <div class="btn-row">
      <button class="primary" onclick="learnRetry()">もう一度</button>
      <button onclick="learnShuffle()">シャッフル</button>
      <button onclick="goHome()">ホームへ</button>
    </div>
  </div>
</div>

<!-- Quiz -->
<div id="s-quiz" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="goGroupSelect('test')"><i class="ti ti-arrow-left" aria-hidden="true"></i> 戻る</button>
    <div class="topbar-title" id="quiz-title"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="q-prog" style="width:0%"></div></div>
  <div class="quiz-meta">
    <span id="q-counter">1 / 30</span>
    <span id="q-score-live">正解: 0 / 不正解: 0</span>
  </div>
  <div class="quiz-word" id="q-word"></div>
  <div class="quiz-pos" id="q-pos"></div>
  <div class="choices" id="q-choices"></div>
  <div class="quiz-feedback" id="q-feedback"></div>
  <div style="text-align:center;"><button class="primary" id="q-next" onclick="quizNext()" style="display:none">次の問題 →</button></div>
</div>

<!-- Quiz Result -->
<div id="s-result" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホーム</button>
    <div class="topbar-title">テスト結果</div>
  </div>
  <div class="result-wrap">
    <div class="big" id="r-emoji"></div>
    <div class="result-score" id="r-score"></div>
    <div class="result-sub" id="r-sub"></div>
    <h3 id="r-title"></h3>
    <p id="r-msg"></p>
    <div class="stat-grid">
      <div class="stat-card"><div class="sv" id="rs-correct" style="color:var(--color-text-success)"></div><div class="sl">正解</div></div>
      <div class="stat-card"><div class="sv" id="rs-wrong" style="color:var(--color-text-danger)"></div><div class="sl">不正解</div></div>
      <div class="stat-card"><div class="sv" id="rs-total-wrong"></div><div class="sl">累計誤答</div></div>
    </div>
    <div class="btn-row">
      <button class="primary" onclick="retryQuiz()">もう一度</button>
      <button onclick="goGroupSelect('test')">別グループ</button>
      <button onclick="goHome()">ホームへ</button>
    </div>
  </div>
</div>

<!-- Wrong List -->
<div id="s-wrong" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()"><i class="ti ti-arrow-left" aria-hidden="true"></i> ホーム</button>
    <div class="topbar-title">間違いリスト</div>
  </div>
  <div id="wrong-list-content"></div>
</div>
</div>

const GROUP_DESC=["頻出ビジネス基本単語 #1–30","ビジネス中級単語 #31–60","上級ビジネス単語 #61–90","難問・最上級単語 #91–120"];

let wrongSet=new Set();

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){stopLearn();updateHomeCount();show('s-home');}
function updateHomeCount(){
  const c=wrongSet.size;
  document.getElementById('home-wrong-count').textContent=c>0?`現在 ${c}語 の誤答を記録中`:'';
  document.getElementById('review-card').classList.toggle('disabled',c===0);
}
function goGroupSelect(mode){
  currentMode=mode;reviewMode=false;
  document.getElementById('group-mode-title').textContent=mode==='learn'?'⚡ 学習モード':'✏️ テストモード';
  const list=document.getElementById('group-list');list.innerHTML='';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');d.className='group-item';
    d.onclick=(g=>()=>startSession(g))(i);
    d.innerHTML=`<div class="group-num">${i+1}</div><div class="group-info"><h4>${GROUP_NAMES[i]}</h4><p>${GROUP_DESC[i]}</p></div><i class="ti ti-chevron-right" aria-hidden="true" style="margin-left:auto;color:var(--color-text-tertiary);font-size:16px;"></i>`;
    list.appendChild(d);
  }
  show('s-group');
}
function startSession(g){currentGroup=g;currentMode==='learn'?startLearn(g,false):startQuiz(g);}
function startReview(){if(wrongSet.size===0)return;reviewMode=true;startLearnWithQueue(WORDS.filter(w=>wrongSet.has(w.en)),'🔁 復習モード');}
function startLearn(g,shuffle){let q=WORDS.filter(w=>w.g===g);if(shuffle){for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}}startLearnWithQueue(q,GROUP_NAMES[g]);}
function startLearnWithQueue(q,title){
  learnQueue=q;learnIdx=0;currentLap=1;learnRunning=false;learnPaused=false;
  totalLaps=parseInt(document.getElementById('lap-input').value)||3;
  document.getElementById('learn-title').textContent=title;
  document.getElementById('l-en').textContent='READY?';
  document.getElementById('l-ja').textContent='スタートを押して開始';
  document.getElementById('l-pos').textContent='';
  document.getElementById('illus-wrap').innerHTML='';
  document.getElementById('learn-prog').style.width='0%';
  document.getElementById('l-counter').textContent='';
  document.getElementById('lap-badge').textContent='';
  document.getElementById('l-start').style.display='';
  document.getElementById('l-pause').style.display='none';
  document.getElementById('l-stop-btn').style.display='none';
  document.getElementById('l-pause').textContent='一時停止';
  document.getElementById('l-en').style.opacity='1';
  document.getElementById('l-ja').style.opacity='1';
  show('s-learn');
}
function getInterval(){return SPEED_MAP[document.getElementById('speed').value];}
function onSpeed(){document.getElementById('speed-val').textContent=SPEED_LABEL[document.getElementById('speed').value];if(learnRunning&&!learnPaused){clearTimeout(learnTimer);showLearnNext();}}

function showLearnWord(i){
  const w=learnQueue[i];
  document.getElementById('l-en').textContent=w.en.toUpperCase();
  document.getElementById('l-ja').textContent=w.ja;
  document.getElementById('l-pos').textContent=w.pos;
  document.getElementById('illus-wrap').innerHTML=buildIllus(w.il||w.en);
  const pct=Math.round(((currentLap-1)*learnQueue.length+i+1)/(totalLaps*learnQueue.length)*100);
  document.getElementById('learn-prog').style.width=pct+'%';
  document.getElementById('l-counter').textContent=`${i+1} / ${learnQueue.length}　（${currentLap}周目 / 全${totalLaps}周）`;
  document.getElementById('lap-badge').textContent=`${currentLap}周目`;
  document.getElementById('l-en').style.opacity='1';
  document.getElementById('l-ja').style.opacity='1';
  flashIt();
}
function showLearnNext(){
  if(learnIdx>=learnQueue.length){
    if(currentLap<totalLaps){currentLap++;learnIdx=0;showLearnNext();}
    else learnFinish();return;
  }
  showLearnWord(learnIdx);learnIdx++;
  learnTimer=setTimeout(showLearnNext,getInterval());
}
function learnStart(){
  if(learnRunning)return;
  totalLaps=parseInt(document.getElementById('lap-input').value)||3;
  learnRunning=true;learnStart_=Date.now();
  document.getElementById('l-start').style.display='none';
  document.getElementById('l-pause').style.display='';
  document.getElementById('l-stop-btn').style.display='';
  showLearnNext();
}
function learnPause(){
  const btn=document.getElementById('l-pause');
  if(!learnPaused){clearTimeout(learnTimer);learnPaused=true;btn.textContent='再開';document.getElementById('l-en').style.opacity='.3';document.getElementById('l-ja').style.opacity='.3';}
  else{learnPaused=false;btn.textContent='一時停止';showLearnNext();}
}
function stopLearn(){clearTimeout(learnTimer);learnRunning=false;learnPaused=false;}
function learnStop(){stopLearn();reviewMode?goHome():goGroupSelect('learn');}
function learnFinish(){
  stopLearn();
  const el=Math.round((Date.now()-learnStart_)/1000);
  const m=Math.floor(el/60),s=el%60;
  document.getElementById('lr-msg').textContent=`${learnQueue.length}語 × ${totalLaps}周 を ${m>0?m+'分'+s+'秒':s+'秒'} で完了！`;
  show('s-learn-result');
}
function learnRetry(){stopLearn();learnIdx=0;currentLap=1;learnRunning=false;learnPaused=false;document.getElementById('l-start').style.display='';document.getElementById('l-pause').style.display='none';document.getElementById('l-stop-btn').style.display='none';document.getElementById('l-en').textContent='READY?';document.getElementById('l-ja').textContent='スタートを押して開始';document.getElementById('l-pos').textContent='';document.getElementById('illus-wrap').innerHTML='';document.getElementById('learn-prog').style.width='0%';document.getElementById('l-counter').textContent='';document.getElementById('lap-badge').textContent='';show('s-learn');}
function learnShuffle(){const arr=[...learnQueue];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}startLearnWithQueue(arr,document.getElementById('learn-title').textContent);}

function startQuiz(g){
  const pool=WORDS.filter(w=>w.g===g);
  quizQueue=[...pool];quizIdx=0;quizCorrect=0;quizWrong=0;
  document.getElementById('quiz-title').textContent=GROUP_NAMES[g];
  show('s-quiz');renderQuiz();
}
function normPos(p){
  if(!p)return'その他';
  if(p.includes('動詞'))return'動詞';
  if(p.includes('名詞'))return'名詞';
  if(p.includes('形容詞'))return'形容詞';
  if(p.includes('副詞'))return'副詞';
  return'その他';
}
function renderQuiz(){
  if(quizIdx>=quizQueue.length){showResult();return;}
  quizAnswered=false;
  const w=quizQueue[quizIdx];
  document.getElementById('q-word').textContent=w.en.toUpperCase();
  document.getElementById('q-pos').textContent=w.pos;
  document.getElementById('q-prog').style.width=Math.round(quizIdx/quizQueue.length*100)+'%';
  document.getElementById('q-counter').textContent=(quizIdx+1)+' / '+quizQueue.length;
  document.getElementById('q-score-live').textContent='正解: '+quizCorrect+' / 不正解: '+quizWrong;
  document.getElementById('q-feedback').textContent='';
  document.getElementById('q-next').style.display='none';
  const targetPos=normPos(w.pos);
  let samePosPool=WORDS.filter(x=>x.en!==w.en&&normPos(x.pos)===targetPos);
  if(samePosPool.length<3)samePosPool=[...samePosPool,...WORDS.filter(x=>x.en!==w.en&&normPos(x.pos)!==targetPos)];
  samePosPool=samePosPool.sort(()=>Math.random()-.5);
  const distractors=samePosPool.slice(0,3);
  const choices=[w,...distractors].sort(()=>Math.random()-.5);
  const box=document.getElementById('q-choices');box.innerHTML='';
  choices.forEach(c=>{
    const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=c.ja;
    btn.onclick=()=>answerQuiz(c.en===w.en,btn,w.ja,w.en);
    box.appendChild(btn);
  });
}
function answerQuiz(correct,btn,correctJa,wordEn){
  if(quizAnswered)return;quizAnswered=true;
  document.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;if(b.textContent===correctJa)b.classList.add('correct');});
  if(correct){btn.classList.add('correct');quizCorrect++;document.getElementById('q-feedback').textContent='正解！';document.getElementById('q-feedback').style.color='var(--color-text-success)';}
  else{btn.classList.add('wrong');quizWrong++;wrongSet.add(wordEn);document.getElementById('q-feedback').textContent='不正解。正解: '+correctJa;document.getElementById('q-feedback').style.color='var(--color-text-danger)';}
  document.getElementById('q-score-live').textContent='正解: '+quizCorrect+' / 不正解: '+quizWrong;
  document.getElementById('q-next').style.display='';
}
function quizNext(){quizIdx++;renderQuiz();}
function showResult(){
  const total=quizQueue.length,pct=Math.round(quizCorrect/total*100);
  let emoji='🎉',title='よくできました！',msg='';
  if(pct>=90){emoji='🏆';title='パーフェクト！';msg='ほぼ満点！次のグループへ挑戦しよう。';}
  else if(pct>=70){emoji='🎉';title='よくできました！';msg='着実に覚えています。誤答単語を復習しよう。';}
  else if(pct>=50){emoji='📖';title='もう少し！';msg='復習モードで苦手を克服しよう。';}
  else{emoji='💪';title='練習しましょう！';msg='学習モードで確認してから再挑戦しよう。';}
  document.getElementById('r-emoji').textContent=emoji;
  document.getElementById('r-score').textContent=quizCorrect+' / '+total+'問';
  document.getElementById('r-sub').textContent='正答率 '+pct+'%';
  document.getElementById('r-title').textContent=title;
  document.getElementById('r-msg').textContent=msg;
  document.getElementById('rs-correct').textContent=quizCorrect;
  document.getElementById('rs-wrong').textContent=quizWrong;
  document.getElementById('rs-total-wrong').textContent=wrongSet.size;
  show('s-result');
}
function retryQuiz(){startQuiz(currentGroup);}
function showWrongList(){
  const cont=document.getElementById('wrong-list-content');
  if(wrongSet.size===0){cont.innerHTML='<div style="text-align:center;padding:2rem;color:var(--color-text-secondary);font-size:14px;">誤答はまだ記録されていません</div>';show('s-wrong');return;}
  const items=WORDS.filter(w=>wrongSet.has(w.en));
  let html=`<div style="font-size:clamp(11px,2.5vw,12px);color:var(--color-text-secondary);margin-bottom:.75rem;">${items.length}語 が記録されています</div>`;
  items.forEach(w=>{
    html+=`<div class="wrong-item"><div style="width:clamp(40px,10vw,52px);height:clamp(32px,8vw,42px);flex-shrink:0;">${buildIllus(w.il||w.en)}</div><div style="flex:1;min-width:0;"><div class="we">${w.en}</div><div class="wj">${w.ja}</div><div class="wp">${w.pos}</div></div><button class="success" style="font-size:clamp(11px,2.5vw,12px);padding:5px 8px;flex-shrink:0;white-space:nowrap;" onclick="markLearned('${w.en}',this)"><i class="ti ti-check" aria-hidden="true"></i> 覚えた</button></div>`;
  });
  cont.innerHTML=html;show('s-wrong');
}
function markLearned(en,btn){
  wrongSet.delete(en);
  const item=btn.closest('.wrong-item');item.style.opacity='.35';item.style.pointerEvents='none';
  const cnt=document.querySelector('#wrong-list-content > div:first-child');
  if(cnt)cnt.textContent=`${wrongSet.size}語 が記録されています`;
  updateHomeCount();
}
updateHomeCount();
</script>
